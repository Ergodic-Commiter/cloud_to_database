[project]
name = "ptlf"
version = "0.1.0"
requires-python = "~=3.12.2"
description = "PTLF pipeline and Azure Function"
readme = "readme.md"
dependencies = [
    "azure-functions>=1.23,<2.0", 
    "azurefunctions-extensions-bindings-blob>=1.1,<2.0", 
    "azure-identity>=1.23,<2.0",
    "azure-storage-blob>=12.26,<13.0",
    "joblib>=1.5,<2.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=21.0,<22.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "pyodbc>=5.2,<6.0",
    "sqlalchemy>=2.0,<3.0",
    "toolz>=1.0,<2.0", 
    "typer>=0.19,<1.0", 
    "ibis-framework[mssql] (>=11.0.0,<12.0.0)", 
    "jinja2 (>=3.1.6,<4.0.0)", 
    "deepmerge (>=2.0,<3.0)", 
    "pandera (>=0.31.1,<0.32.0)" ]

[project.scripts]
ptlf = "cli.main:app"

[tool.poetry]
packages = [ 
    { from = "src", include = "ptlf" } ]  

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"   
pylint = "^3.3"
ipython = "^9.3"
mac-alias = "^2.2"
msgraph-sdk = "^1.31"
office365-rest-python-client = "^2.6"
pylnk3 = "^0.4.3"
sqlacodegen = "^4.0.3"
ruff = "^0.15.16"
pylint-pydantic = "^0.4.1"
alembic = "^1.18.4"

[tool.pytest.ini_options]
    addopts = "--tb=line"

[tool.pylint.main]
load-plugins = ["pylint_pydantic"]

[tool.pylint.MASTER]
ignore-paths = [
  "src/ptlf/core/models/converterx",  
  "src/notebooks",
  "src/sandbox", 
  "src/infra" ]

[tool.pylint."MESSAGES CONTROL"]
disable = ["missing-class-docstring", "missing-final-newline", 
    "missing-function-docstring", "missing-module-docstring",  
    "non-ascii-module-import", "non-ascii-name", "superfluous-parens",
    "too-few-public-methods", "too-many-lines", "trailing-whitespace", 
    "trailing-newlines", "unnecessary-lambda-assignment", "use-dict-literal", 
    "useless-return", "consider-using-f-string"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[build-system]
requires = [ "poetry-core>=2.0.0" ]
build-backend = "poetry.core.masonry.api"


[tool.alembic]
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
script_location = "%(here)s/migrations"
file_template = "%%(year)d_%%(month).2d_%%(day).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = [".", "src"]
